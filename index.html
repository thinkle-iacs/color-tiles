<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Color Tiles</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <!-- Tile 1: replace the text, add an image, and design for your first color. -->
      <section class="tile tile-one" aria-labelledby="title-one">
        <h1 id="title-one">Your first color</h1>
        <p>What emotion, topic, and image will this color inspire?</p>
        <!-- Add your image here: <img src="images/your-image.jpg" alt="Describe your image"> -->
      </section>

      <!-- Tile 2: design for your second assigned color. -->
      <section class="tile tile-two" aria-labelledby="title-two">
        <h1 id="title-two">Your second color</h1>
        <p>Let this color lead you to a different idea.</p>
        <!-- Add your image here: <img src="images/your-image.jpg" alt="Describe your image"> -->
      </section>
    </main>
  </body>
</html>
